name: Taxonomies CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - name: Build
        run: pnpm run build
      - name: Check package READMEs
        run: pnpm run check:package-readmes
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Validate taxonomies
        run: pnpm run validate
