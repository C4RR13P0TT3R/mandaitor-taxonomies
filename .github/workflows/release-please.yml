name: Release Please

on:
  push:
    branches: [main]
  # Manual re-fire for runs lost to transient failures (e.g. API rate
  # limits on the shared token) without needing another push to main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      # Manifest (monorepo) mode: every publishable workspace package is
      # versioned independently via release-please-config.json +
      # .release-please-manifest.json. Merging the release PR bumps each
      # changed package's package.json/CHANGELOG and cuts one GitHub release
      # per component with tags like `taxonomy-core-v0.4.0` — which is what
      # publish.yml keys on. The root package.json version is no longer
      # release-managed (it is private and never published).
      # RELEASE_PLEASE_TOKEN is a dedicated fine-grained PAT scoped to this
      # repo (contents + pull-requests read/write). It replaced the shared
      # CROSS_REPO_TOKEN after Aug 4, when that PAT sat rate-limited for 90+
      # consecutive minutes (some other consumer drains its 5000/h quota) and
      # every release-please run died on 'API rate limit already exceeded'.
      # A PAT (not GITHUB_TOKEN) is still required so the release PRs it
      # opens trigger CI — GITHUB_TOKEN-created PRs never start workflows,
      # which would leave required checks permanently pending.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
