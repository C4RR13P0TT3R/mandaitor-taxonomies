name: Release Please

on:
  push:
    branches: [main]
  # Manual re-fire for runs lost to transient failures (e.g. API rate
  # limits on the shared token) without needing another push to main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Merge bursts fire one full 9-component crawl per push; back-to-back runs
# recompute the same state and can exhaust the token owner's hourly API
# quota by themselves (Aug 4 and Aug 6 incidents — four merges in twenty
# minutes preceded 'API rate limit already exceeded'). Superseded runs are
# cancelled so only the newest crawl completes; release-please is
# idempotent, so only the latest state matters.
concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      # Manifest (monorepo) mode: every publishable workspace package is
      # versioned independently via release-please-config.json +
      # .release-please-manifest.json. Merging the release PR bumps each
      # changed package's package.json/CHANGELOG and cuts one GitHub release
      # per component with tags like `taxonomy-core-v0.4.0` — which is what
      # publish.yml keys on. The root package.json version is no longer
      # release-managed (it is private and never published).
      # RELEASE_PLEASE_TOKEN is a dedicated fine-grained PAT scoped to this
      # repo (contents + pull-requests read/write). Note: ALL of a user's
      # PATs draw from the same 5,000/h per-user quota, so a dedicated PAT
      # isolates scopes but cannot dodge user-level exhaustion — the Aug 4
      # and Aug 6 'API rate limit already exceeded for user ID' failures hit
      # regardless of which secret was used. True quota isolation needs a
      # GitHub App installation token (own 5,000/h pool), which can be fed
      # into this same input via actions/create-github-app-token.
      # A PAT/app token (not GITHUB_TOKEN) is still required so the release
      # PRs it opens trigger CI — GITHUB_TOKEN-created PRs never start
      # workflows, which would leave required checks permanently pending.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
