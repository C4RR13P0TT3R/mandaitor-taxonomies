name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

permissions:
  actions: read
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --output semgrep-results.sarif

      - name: Upload SARIF as artifact
        if: always( )
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 30

      - name: Semgrep step summary
        if: always()
        run: |
          echo "## Semgrep SAST Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f semgrep-results.sarif ]; then
            FINDINGS=$(python3 -c "
          import json, sys
          with open('semgrep-results.sarif') as f:
              data = json.load(f)
          runs = data.get('runs', [])
          total = sum(len(r.get('results', [])) for r in runs)
          print(total)
          " 2>/dev/null || echo "unknown")
            echo "**Findings:** $FINDINGS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No SARIF output produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \`semgrep-sarif\` artifact for full details." >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # pnpm 11 requires Node >= 22.13 (uses node:sqlite). This audit
          # job only scans the lockfile, so it is decoupled from the repo's
          # pinned runtime Node (.nvmrc = 20).
          node-version: "22"
      - name: Run pnpm audit
        # pnpm audit reads pnpm-lock.yaml directly — no install needed.
        # pnpm 11 queries npm's bulk advisory endpoint; pnpm <=10 called the
        # legacy /-/npm/v1/security/audits endpoint, which npm retired (HTTP 410).
        # --prod is intentionally dropped: this workspace keeps runtime deps in
        # member packages (the root has only devDependencies), so pnpm 11's
        # --prod filter audits 0 packages. The full locked tree is scanned at
        # the same high+ threshold instead.
        run: pnpm audit --audit-level=high
      - name: Audit summary
        run: |
          echo "## Dependency Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run \`pnpm audit\` locally for full details." >> "$GITHUB_STEP_SUMMARY"
