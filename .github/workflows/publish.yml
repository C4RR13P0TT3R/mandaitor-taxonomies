on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to backfill (component tag like taxonomy-core-v0.4.0, or legacy vX.Y.Z)"
        required: true
        type: string
      url:
        description: "Release URL override (optional)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Treat this run as prerelease"
        required: false
        type: boolean
        default: false
      skip_publish:
        description: "Skip npm publish and only regenerate manifest / downstream dispatch"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Normalize release context
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_URL: ${{ inputs.url || '' }}
          INPUT_PRERELEASE: ${{ inputs.prerelease || false }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_URL: ${{ github.event.release.html_url || '' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            URL="$INPUT_URL"
            PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="$RELEASE_TAG"
            URL="$RELEASE_URL"
            PRERELEASE="$RELEASE_PRERELEASE"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Release tag is required."
            exit 1
          fi

          if [ -z "$URL" ]; then
            URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          fi

          {
            echo "RELEASE_TAG=$TAG"
            echo "RELEASE_URL=$URL"
            echo "RELEASE_PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Hard guard against the "release tagged but versions never bumped"
      # failure mode: for a component tag (taxonomy-core-v0.4.0) the tagged
      # package's package.json version must match the tag, or this run would
      # be a silent no-op. Legacy root tags (vX.Y.Z) are allowed for
      # backfills, with a warning. Also exports TAG_KIND for later steps.
      - name: Guard release tag against package versions
        run: node scripts/release-tools.mjs check-tag "$RELEASE_TAG"

      # Backfill compatibility: tags cut before the repo pinned pnpm via
      # "packageManager" (and before the overrides moved to
      # pnpm-workspace.yaml) cannot drive pnpm/action-setup or a frozen
      # install. For those old states, overlay the CURRENT build harness
      # from main — root package.json, workspace config, lockfile, .nvmrc,
      # release scripts — while the published package sources stay exactly
      # at the tag. Release-event publishes of modern tags never hit this.
      - name: Modernize build harness for backfill tags
        if: github.event_name == 'workflow_dispatch'
        run: |
          if node -e "process.exit(require('./package.json').packageManager ? 1 : 0)"; then
            echo "Pre-packageManager tag detected — overlaying current build harness from main."
            git fetch --depth=1 origin main
            git checkout FETCH_HEAD -- package.json pnpm-workspace.yaml pnpm-lock.yaml .nvmrc scripts/
          else
            echo "Tag carries its own packageManager pin — no overlay needed."
          fi

      # pnpm >= 10.13 is required for npm Trusted Publishing (OIDC): it
      # exchanges the GitHub id-token directly with npm during publish,
      # so no static NPM_TOKEN secret is needed anymore.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Deliberately NO registry-url here: setup-node's registry-url writes a
      # user-level .npmrc with `_authToken=${NODE_AUTH_TOKEN}` and points
      # NPM_CONFIG_USERCONFIG at it. With NODE_AUTH_TOKEN unset (we publish
      # tokenless), pnpm treats that entry as configured-but-broken
      # credentials and SKIPS its OIDC trusted-publishing exchange — the PUT
      # then goes out unauthenticated and npm answers E404 (run 28). Without
      # the option no .npmrc is planted, pnpm finds no credentials, and the
      # id-token exchange happens as intended. Installs and publishes both
      # target the default public registry, so nothing else needs it.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # pnpm publish delegates the registry PUT to the system npm, and npm
      # >= 11.5.1 is what actually implements the OIDC token exchange —
      # Node 20's bundled npm 10 has no trusted publishing and dies with
      # ENEEDAUTH (backfill run 29). Pin the npm 11 line: npm@12 requires
      # Node >= 22, which .nvmrc doesn't give us. Same pattern as
      # mandaitor-core's publish workflow, where it is proven.
      - name: Update npm for Trusted Publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        # --ignore-scripts prevents transitive dependency lifecycle scripts
        # (preinstall/install/postinstall/prepare) from executing in this
        # OIDC-capable publish job. Workspace packages are built explicitly
        # in the next step, so no needed build is skipped by suppressing
        # dependency scripts here.
        # Frozen install first; for backfill tags whose per-package specs
        # drifted from main's lockfile importers, fall back to a re-resolve
        # rather than failing the backfill.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false || {
            echo "::warning::Frozen install failed (backfill-tag drift vs current lockfile) — retrying with --no-frozen-lockfile."
            pnpm install --no-frozen-lockfile --ignore-scripts --config.strict-dep-builds=false
          }

      # Order is deliberate: install (--ignore-scripts) -> build -> publish, so
      # our own packages are compiled before the OIDC-authenticated publish step.
      - name: Build all packages
        run: pnpm run build

      - name: Check package READMEs
        run: pnpm run check:package-readmes

      - name: Test all packages
        run: pnpm run test

      - name: Validate all taxonomies
        run: pnpm run validate

      - name: Check for scaffold TODOs
        run: |
          TODO_HITS=$(grep -r "// TODO:" taxonomies/*/src/ packages/*/src/ 2>/dev/null || true  )
          if [ -n "$TODO_HITS" ]; then
            echo "::error::Scaffold TODOs found in publishable source files:"
            echo "$TODO_HITS"
            exit 1
          fi
          echo "No scaffold TODOs found in source files"

      # Record which workspace versions are already on the registry, so the
      # post-publish step can compute exactly what THIS run published.
      - name: Snapshot registry state
        if: github.event_name != 'workflow_dispatch' || inputs.skip_publish == false
        run: node scripts/release-tools.mjs snapshot /tmp/pre-publish.json

      - name: Publish packages
        if: github.event_name != 'workflow_dispatch' || inputs.skip_publish == false
        # Auth is npm Trusted Publishing (OIDC): each @mandaitor package on
        # npmjs.com registers this repo + workflow as a trusted publisher, and
        # pnpm exchanges the job's id-token (id-token: write) for publish
        # credentials during the PUT — no NODE_AUTH_TOKEN, deliberately. A
        # static token here would shadow the OIDC exchange, and the old
        # NPM_TOKEN was 2FA-bound, which is why every publish died on EOTP
        # (runs 15-25 in Jul, run 27 on Aug 4). --provenance attaches the
        # attestation from the same id-token. pnpm -r publish also resolves
        # the workspace:* dependency on @mandaitor/taxonomy-core to concrete
        # versions in the tarballs.
        run: pnpm -r publish --no-git-checks --access public --provenance

      # Verify against the registry (not pnpm's output): every workspace
      # version must exist on npm after this step, and the delta of what this
      # run actually published is written for the manifest/dispatch/summary.
      - name: Verify publish against registry
        if: github.event_name != 'workflow_dispatch' || inputs.skip_publish == false
        run: |
          node scripts/release-tools.mjs verify /tmp/pre-publish.json /tmp/publish-delta.json
          COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/publish-delta.json'))['published']))")
          echo "PUBLISHED_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Record skipped publish
        if: github.event_name == 'workflow_dispatch' && inputs.skip_publish == true
        run: |
          echo '{"published": [], "already_published": [], "missing": [], "skipped": true}' > /tmp/publish-delta.json
          echo "PUBLISHED_COUNT=0" >> "$GITHUB_ENV"

      # Zero-publish policy: a release run that publishes nothing is an error
      # unless a sibling run already pushed the tagged component's version
      # (release-please cuts one release per component, so a multi-package
      # merge triggers several runs and the first one publishes everything).
      # Legacy root tags have no per-run component, so zero publishes there
      # means the tag carries no new versions — the exact v2.0.x failure.
      - name: Enforce zero-publish policy
        if: github.event_name != 'workflow_dispatch' || inputs.skip_publish == false
        run: |
          if [ "$PUBLISHED_COUNT" != "0" ]; then
            echo "Published $PUBLISHED_COUNT package version(s) in this run."
            exit 0
          fi
          if [ "$TAG_KIND" = "component" ]; then
            echo "::notice::No packages published in this run; $TAG_COMPONENT@$TAG_VERSION is already on the registry (published by a sibling release run). Nothing to do."
            exit 0
          fi
          echo "::error::This release run published nothing: every workspace package version already exists on npm."
          echo "::error::That means the release tag '$RELEASE_TAG' carries no new package versions. Bump package versions via a release-please release PR, then release again."
          exit 1

      - name: Generate release manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          url = os.environ['RELEASE_URL']
          prerelease = os.environ.get('RELEASE_PRERELEASE', 'false').lower() == 'true'

          Path('/tmp/tag.txt').write_text(f'{tag}\n', encoding='utf-8')

          # What this run actually pushed to npm (registry-verified) — the
          # manifest must describe reality, not just the package.json files.
          delta = json.loads(Path('/tmp/publish-delta.json').read_text(encoding='utf-8'))
          published_now = {(p['name'], p['version']) for p in delta['published']}

          manifest = {
              'tag': tag,
              'url': url,
              'prerelease': prerelease,
              'packages': [],
              'taxonomies': [],
              'published_packages': sorted(
                  f"{p['name']}@{p['version']}" for p in delta['published']
              ),
          }

          for package_file in sorted(Path('packages').glob('*/package.json')):
              pkg = json.loads(package_file.read_text(encoding='utf-8'))
              manifest['packages'].append({
                  'name': pkg['name'],
                  'version': pkg['version'],
                  'description': pkg.get('description', ''),
                  'kind': 'core',
                  'slug': package_file.parent.name,
                  'published_in_this_run': (pkg['name'], pkg['version']) in published_now,
              })

          for package_file in sorted(Path('taxonomies').glob('*/package.json')):
              pkg = json.loads(package_file.read_text(encoding='utf-8'))
              item = {
                  'name': pkg['name'],
                  'version': pkg['version'],
                  'description': pkg.get('description', ''),
                  'kind': 'taxonomy',
                  'slug': package_file.parent.name,
                  'published_in_this_run': (pkg['name'], pkg['version']) in published_now,
              }
              manifest['packages'].append(item)
              manifest['taxonomies'].append({
                  'slug': item['slug'],
                  'package_name': item['name'],
                  'version': item['version'],
                  'description': item['description'],
              })

          Path('/tmp/release-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: taxonomy-release-manifest-${{ env.RELEASE_TAG }}
          path: /tmp/release-manifest.json

      # Only tell downstream repos about a release when this run actually
      # pushed packages to npm — dispatching on a no-op run (the old
      # behaviour) made ops/public act on releases that never happened.
      - name: Dispatch downstream automation
        if: env.RELEASE_PRERELEASE != 'true' && env.PUBLISHED_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CROSS_REPO_TOKEN is not configured; skipping downstream dispatch."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          manifest = json.loads(Path('/tmp/release-manifest.json').read_text(encoding='utf-8'))
          payload = {
              'event_type': 'taxonomy-release',
              'client_payload': {
                  'tag': manifest['tag'],
                  'url': manifest['url'],
                  'prerelease': manifest['prerelease'],
                  'published_packages': manifest.get('published_packages', []),
              },
          }

          targets = [
              'C4RR13P0TT3R/mandaitor-ops',
              'C4RR13P0TT3R/mandaitor-public',
          ]

          with tempfile.NamedTemporaryFile('w', delete=False, encoding='utf-8') as handle:
              json.dump(payload, handle)
              handle.flush()

              for repo in targets:
                  subprocess.run(
                      [
                          'gh',
                          'api',
                          f'repos/{repo}/dispatches',
                          '--method',
                          'POST',
                          '--input',
                          handle.name,
                      ],
                      check=True,
                  )
          PY

      - name: Publish summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('/tmp/release-manifest.json').read_text(encoding='utf-8'))
          delta = json.loads(Path('/tmp/publish-delta.json').read_text(encoding='utf-8'))
          published = manifest.get('published_packages', [])

          print('## Taxonomy Release Run')
          print()
          print(f"Release: `{os.environ['RELEASE_TAG']}`")
          print('Registry: https://www.npmjs.com/org/mandaitor')
          if delta.get('skipped'):
              print()
              print('Publish was skipped (`skip_publish` dispatch) — manifest regenerated only.')
          elif published:
              print(f'Packages published in this run: {len(published)}')
              print()
              for entry in published:
                  print(f'- `{entry}`')
              print()
              print('Downstream dispatch: mandaitor-ops, mandaitor-public')
          else:
              print('Packages published in this run: 0 — all workspace versions were already on the registry.')
              print('Downstream dispatch: skipped (nothing new was published).')
          print()
          print(f"Already on registry: {len(delta.get('already_published', []))}")
          print(f"Taxonomies in repo: {len(manifest['taxonomies'])}")
          PY
