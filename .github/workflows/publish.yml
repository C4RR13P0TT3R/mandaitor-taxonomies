name: Publish Taxonomies

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to backfill (for example v1.3.0)"
        required: true
        type: string
      url:
        description: "Release URL override (optional)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Treat this run as prerelease"
        required: false
        type: boolean
        default: false
      skip_publish:
        description: "Skip npm publish and only regenerate manifest / downstream dispatch"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Normalize release context
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_URL: ${{ inputs.url || '' }}
          INPUT_PRERELEASE: ${{ inputs.prerelease || false }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_URL: ${{ github.event.release.html_url || '' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            URL="$INPUT_URL"
            PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="$RELEASE_TAG"
            URL="$RELEASE_URL"
            PRERELEASE="$RELEASE_PRERELEASE"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Release tag is required."
            exit 1
          fi

          if [ -z "$URL" ]; then
            URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          fi

          {
            echo "RELEASE_TAG=$TAG"
            echo "RELEASE_URL=$URL"
            echo "RELEASE_PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@mandaitor"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build all packages
        run: pnpm run build

      - name: Check package READMEs
        run: pnpm run check:package-readmes

      - name: Test all packages
        run: pnpm run test

      - name: Validate all taxonomies
        run: pnpm run validate

      - name: Check for scaffold TODOs
        run: |
          TODO_HITS=$(grep -r "// TODO:" taxonomies/*/src/ packages/*/src/ 2>/dev/null || true )
          if [ -n "$TODO_HITS" ]; then
            echo "::error::Scaffold TODOs found in publishable source files:"
            echo "$TODO_HITS"
            exit 1
          fi
          echo "No scaffold TODOs found in source files"

      - name: Publish packages
        if: github.event_name != 'workflow_dispatch' || inputs.skip_publish == false
        run: pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          url = os.environ['RELEASE_URL']
          prerelease = os.environ.get('RELEASE_PRERELEASE', 'false').lower() == 'true'

          Path('/tmp/tag.txt').write_text(f'{tag}\n', encoding='utf-8')

          manifest = {
              'tag': tag,
              'url': url,
              'prerelease': prerelease,
              'packages': [],
              'taxonomies': [],
          }

          for package_file in sorted(Path('packages').glob('*/package.json')):
              pkg = json.loads(package_file.read_text(encoding='utf-8'))
              manifest['packages'].append({
                  'name': pkg['name'],
                  'version': pkg['version'],
                  'description': pkg.get('description', ''),
                  'kind': 'core',
                  'slug': package_file.parent.name,
              })

          for package_file in sorted(Path('taxonomies').glob('*/package.json')):
              pkg = json.loads(package_file.read_text(encoding='utf-8'))
              item = {
                  'name': pkg['name'],
                  'version': pkg['version'],
                  'description': pkg.get('description', ''),
                  'kind': 'taxonomy',
                  'slug': package_file.parent.name,
              }
              manifest['packages'].append(item)
              manifest['taxonomies'].append({
                  'slug': item['slug'],
                  'package_name': item['name'],
                  'version': item['version'],
                  'description': item['description'],
              })

          Path('/tmp/release-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: taxonomy-release-manifest-${{ env.RELEASE_TAG }}
          path: /tmp/release-manifest.json

      - name: Dispatch downstream automation
        if: env.RELEASE_PRERELEASE != 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CROSS_REPO_TOKEN is not configured; skipping downstream dispatch."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          manifest = json.loads(Path('/tmp/release-manifest.json').read_text(encoding='utf-8'))
          payload = {
              'event_type': 'taxonomy-release',
              'client_payload': {
                  'tag': manifest['tag'],
                  'url': manifest['url'],
                  'prerelease': manifest['prerelease'],
              },
          }

          with tempfile.NamedTemporaryFile('w', delete=False, encoding='utf-8') as handle:
              json.dump(payload, handle)
              handle.flush()
              subprocess.run(
                  [
                      'gh',
                      'api',
                      'repos/C4RR13P0TT3R/mandaitor-ops/dispatches',
                      '--method',
                      'POST',
                      '--input',
                      handle.name,
                  ],
                  check=True,
              )
          PY

      - name: Publish summary
        run: |
          TAXONOMY_COUNT=$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/release-manifest.json').read_text(encoding='utf-8'))
          print(len(manifest['taxonomies']))
          PY
          )
          PACKAGE_COUNT=$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/release-manifest.json').read_text(encoding='utf-8'))
          print(len(manifest['packages']))
          PY
          )

          echo "## Taxonomy Packages Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Registry: https://www.npmjs.com/org/mandaitor" >> "$GITHUB_STEP_SUMMARY"
          echo "Packages published: ${PACKAGE_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Taxonomies in release: ${TAXONOMY_COUNT}" >> "$GITHUB_STEP_SUMMARY"
