name: Notify Ops on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to notify downstream about"
        required: true
        type: string
      url:
        description: "Release URL override (optional)"
        required: false
        type: string
        default: ""
      author:
        description: "Release author override (optional)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Treat this run as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    name: Trigger Taxonomy Import
    runs-on: ubuntu-latest
    steps:
      - name: Normalize release context
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_URL: ${{ inputs.url || '' }}
          INPUT_AUTHOR: ${{ inputs.author || '' }}
          INPUT_PRERELEASE: ${{ inputs.prerelease || false }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_URL: ${{ github.event.release.html_url || '' }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login || '' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            URL="$INPUT_URL"
            AUTHOR="$INPUT_AUTHOR"
            PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="$RELEASE_TAG"
            URL="$RELEASE_URL"
            AUTHOR="$RELEASE_AUTHOR"
            PRERELEASE="$RELEASE_PRERELEASE"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Release tag is required."
            exit 1
          fi

          if [ -z "$URL" ]; then
            URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          fi

          if [ -z "$AUTHOR" ]; then
            AUTHOR="${{ github.actor }}"
          fi

          {
            echo "RELEASE_TAG=$TAG"
            echo "RELEASE_URL=$URL"
            echo "RELEASE_AUTHOR=$AUTHOR"
            echo "RELEASE_PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"

      - name: Trigger taxonomy import in mandaitor-ops
        if: env.RELEASE_PRERELEASE != 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          repository: C4RR13P0TT3R/mandaitor-ops
          event-type: taxonomy-release
          client-payload: |
            {
              "tag": "${{ env.RELEASE_TAG }}",
              "url": "${{ env.RELEASE_URL }}",
              "author": "${{ env.RELEASE_AUTHOR }}",
              "prerelease": ${{ env.RELEASE_PRERELEASE == 'true' }}
            }

      - name: Notification summary
        run: |
          echo "## Ops Notification Sent" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: \`mandaitor-ops\` → \`taxonomy-import\` workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "Event: \`taxonomy-release\`" >> "$GITHUB_STEP_SUMMARY"
